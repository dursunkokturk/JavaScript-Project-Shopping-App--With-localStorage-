<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sepetiniz</title>
  <link rel="stylesheet" href="assets/css/style.css">
  <script src="assets/js/products.js" defer></script>
</head>

<body>

  <h2 class="basket-title">Sepetiniz</h2>
  <div class="basket-actions">
    <a href="index.html" class="main-menu-back-btn">Ana Menüye Dön</a>
  </div>
  <div class="basket-section">
    <h3>Sepetin İçeriği</h3>
    <table>
      <thead>
        <tr class="table-title">
          <td>Adı</td>
          <td>Üretim Yeri</td>
          <td>Satış Fiyatı (₺)</td>
          <td>Stok Bilgisi (KG)</td>
        </tr>
      </thead>
      <tbody id="allUserBasket">
      </tbody>
    </table>
  </div>

  <div class="basket-actions">
    <h3 id="totalPrice" class="totalPrice"></h3>
    <button id="clearBasket" class="clearBasketButton">
      Sepeti Temizle
    </button>
  </div>
  

</body>

</html>
